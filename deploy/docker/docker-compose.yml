# Deploys `twing serve` as a container behind Caddy for TLS -- the Docker
# counterpart to deploy/'s native systemd path (deploy/README.md), used
# instead of it on boxes that are already Docker-oriented. See
# deploy/docker/README.md for why/when to pick this one.
#
# Run from this directory (`docker compose up -d --build`) -- the build
# context is the repo root (../..), not here, since packages/server can
# only build correctly inside the npm-workspaces monorepo (see
# packages/server/Dockerfile's header comment).

services:
  twing-serve:
    build:
      context: ../..
      dockerfile: packages/server/Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      TWING_SERVE_DATA_DIR: /data
    volumes:
      # Bind mount, not a named volume -- so the backup cron job (see
      # deploy/docker/README.md) can read the SQLite file straight off the
      # host filesystem without needing `docker exec`. Lives inside the
      # checkout itself (not /opt) so `docker compose up` never needs root
      # just to create its own data directory.
      - ./data:/data
      # The GitHub App's private key (optional -- only needed when
      # TWING_GITHUB_APP_* is configured in .env). `env_file` above injects
      # .env's *variables* into the container, but a path one of those
      # variables points at still has to be mounted separately -- the host
      # file otherwise doesn't exist inside the container at all, and
      # TWING_GITHUB_APP_PRIVATE_KEY_PATH resolves to nothing.
      #
      # Mounts the *directory*, not the key file directly -- confirmed live
      # (`docker run -v host-file-that-does-not-exist:...`) that bind-mounting
      # a single file whose host path doesn't exist makes Docker silently
      # create an empty, root-owned directory there instead, on both sides of
      # the mount. For every deployment that never configures the GitHub App
      # (the common case -- this feature is opt-in), that would plant a
      # phantom directory in the checkout that a non-root user can't even
      # `rm` without sudo. `./secrets/` is always a real directory (its
      # `.gitkeep` keeps it in every checkout), so the mount always succeeds;
      # a key that was never placed inside it is then just an ordinary,
      # already-handled ENOENT, not a filesystem-type mismatch.
      - ./secrets:/run/secrets:ro
    # No `ports:` here deliberately -- this is never published to the host.
    # Only the caddy service below can reach it, container-to-container
    # over this compose project's own network (service-name DNS, hence
    # "twing-serve:8787" in Caddyfile rather than an IP or localhost).

  caddy:
    build:
      context: .
      dockerfile: Caddyfile.Dockerfile
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Named volumes, not bind mounts -- this is Caddy's own state
      # (issued certs, its internal config), not something the host needs
      # to read directly. Persists across `docker compose up`/`down` as
      # long as `-v` is never passed to `down` -- avoid that, re-issuing a
      # cert unnecessarily runs into Let's Encrypt's rate limits.
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - twing-serve
    # `default` (this project's own implicit network, still needed for
    # twing-serve:8787 by service-name DNS) plus the external twing-edge
    # network shared with the twing-monitor compose project -- listing
    # `networks:` at all opts a service out of the implicit default unless
    # it's named explicitly here too. See twing-monitor's own
    # deploy/docker/README.md for the other side of this.
    networks:
      - default
      - twing-edge

networks:
  # Created once on the box (`docker network create twing-edge`), outside
  # either compose project's lifecycle -- `docker compose down` here must
  # never delete a network twing-monitor's own compose project also
  # depends on.
  twing-edge:
    external: true

volumes:
  caddy-data:
  caddy-config:
