require_human_review:
  - path: "hook/**"
    reason: "capture edge — must stay a trivial socket client with no decision logic
      (design doc §4)"
  - path: "packages/server/src/design-*.ts"
    reason: "coordinator's core verdict logic — a bug here blocks real Edit/Write
      calls across every gated session (design doc §17)"
  - path: "packages/server/**"
    reason: "the hosted coordinator itself — do not remove or fundamentally
      restructure (e.g. moving it into the daemon/local-only) without human
      sign-off (design doc §17). Added 2026-08-11 after a live test showed
      exactly this change going unblocked."

constraints:
  - text: "use the shared length-prefixed frame codec in packages/core; don't invent
      a second wire format"
    scope: "packages/core/src/framing.ts"
  - text: "twing-hook's PostToolUse capture path must never exit non-zero and must
      never itself deny a tool call — advisory only, unchanged (§4). PreToolUse
      is used only by the separate design-gate path (design doc §17), never by
      capture."
    scope: "hook/**"

triggers:
  - id: "new-socket-protocol"
    pattern: "(?i)socket|protocol|frame"
    match: "new-symbol-name"
    reason: "possible duplicate of packages/core's socket protocol (protocol.ts,
      framing.ts) — check before building another"
coordinator:
  serverUrl: http://localhost:8787
