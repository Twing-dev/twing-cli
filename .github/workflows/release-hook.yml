name: release-hook

# Cross-compiles twing-hook for macOS/Linux/Windows and publishes the
# binaries as GitHub Release assets on a version tag -- see
# packages/cli/src/install-hook.ts's fetchPrebuiltHook, which fetches
# these via the stable /releases/latest/download/<asset> redirect (no API
# token, no rate limit). Asset names must match releaseAssetName() there
# exactly: twing-hook-<os>-<arch>[.exe], os/arch spelled Go's way
# (darwin/linux/windows, amd64/arm64), not Node's (darwin/linux/win32,
# x64/arm64).

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-linux-windows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: hook/go.mod
      # -X main.version=... stamps the release version into the binary
      # (version.go) -- read by the §17 gate's version-compatibility check
      # (design_gate.go's setVersionHeader). Stripped of the leading "v" so
      # it matches npm's bare semver (tag v0.3.0 -> embedded "0.3.0"), same
      # as packages/*/package.json's "version" field.
      - name: Build linux/amd64, linux/arm64, windows/amd64
        working-directory: hook
        run: |
          mkdir -p dist
          VERSION="${GITHUB_REF_NAME#v}"
          GOOS=linux   GOARCH=amd64 go build -ldflags="-X main.version=${VERSION}" -o dist/twing-hook-linux-amd64 .
          GOOS=linux   GOARCH=arm64 go build -ldflags="-X main.version=${VERSION}" -o dist/twing-hook-linux-arm64 .
          GOOS=windows GOARCH=amd64 go build -ldflags="-X main.version=${VERSION}" -o dist/twing-hook-windows-amd64.exe .
      - uses: actions/upload-artifact@v4
        with:
          name: linux-windows-binaries
          path: hook/dist/*

  build-darwin:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: hook/go.mod
      # CGO_ENABLED=1 + -linkmode=external forces Go to hand Mach-O
      # generation to the system's real `cc`/`ld` instead of Go's own
      # internal linker -- found live 2026-08-17: the internal linker
      # doesn't emit the LC_UUID load command, which is harmless on older
      # macOS but a hard dyld launch failure ("missing LC_UUID load
      # command") on newer ones. install-hook.ts's build-from-source
      # fallback got the same fix. Mach-O-only concept, doesn't apply to
      # the Linux/Windows build job at all.
      - name: Build darwin/amd64, darwin/arm64
        working-directory: hook
        env:
          CGO_ENABLED: "1"
        run: |
          mkdir -p dist
          VERSION="${GITHUB_REF_NAME#v}"
          GOOS=darwin GOARCH=amd64 go build -ldflags="-linkmode=external -X main.version=${VERSION}" -o dist/twing-hook-darwin-amd64 .
          GOOS=darwin GOARCH=arm64 go build -ldflags="-linkmode=external -X main.version=${VERSION}" -o dist/twing-hook-darwin-arm64 .
      # Ad-hoc signing, not notarization: free, no Apple Developer account,
      # no registration -- required for the arm64 binary to execute at all
      # on Apple Silicon (a hard OS requirement since Big Sur, separate
      # from Gatekeeper's quarantine check, which install-hook.ts's plain
      # `fetch`-based download never triggers in the first place -- that
      # only applies to browser/Mail downloads). Harmless on amd64.
      - name: Ad-hoc codesign
        working-directory: hook
        run: |
          codesign -s - dist/twing-hook-darwin-amd64
          codesign -s - dist/twing-hook-darwin-arm64
      - uses: actions/upload-artifact@v4
        with:
          name: darwin-binaries
          path: hook/dist/*

  publish:
    needs: [build-linux-windows, build-darwin]
    runs-on: ubuntu-latest
    steps:
      # --generate-notes below needs a real git checkout to diff against
      # the previous tag -- this job otherwise only downloads artifacts, so
      # without this it fails outright ("not a git repository"), found live
      # on the v0.2.0 release.
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish release with all platform binaries attached
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" dist/* --generate-notes
