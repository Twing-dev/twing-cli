name: release-server-image

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  packages: write

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      channel: ${{ steps.policy.outputs.channel }}
      version: ${{ steps.policy.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch release branches
        run: git fetch --force origin '+refs/heads/main:refs/remotes/origin/main' '+refs/heads/release/*:refs/remotes/origin/release/*' --tags
      - id: policy
        run: node scripts/release-policy.mjs "${GITHUB_REF_NAME}" "${GITHUB_SHA}"

  acceptance:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm run test:release-policy
      - run: npm run test:server-lifecycle

  publish:
    needs: [validate, acceptance]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify the tag and server package agree
        run: |
          version="${GITHUB_REF_NAME#v}"
          declared="$(node -p "require('./packages/server/package.json').version")"
          test "$declared" = "$version" || {
            echo "tag $version does not match @twing/server $declared" >&2
            exit 1
          }
      - name: Wait until the matching CLI is installable
        run: |
          version="${GITHUB_REF_NAME#v}"
          for attempt in $(seq 1 60); do
            if [ "$(npm view "@twing/cli@$version" version --prefer-online 2>/dev/null || true)" = "$version" ]; then
              exit 0
            fi
            echo "@twing/cli@$version is not resolvable yet (attempt $attempt/60)"
            sleep 10
          done
          echo "@twing/cli@$version did not become resolvable; refusing to publish a server that clients cannot install" >&2
          exit 1
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/twing-dev/twing-server
          tags: |
            type=raw,value=${{ needs.validate.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},enable=${{ needs.validate.outputs.channel == 'stable' }}
            type=raw,value=latest,enable=${{ needs.validate.outputs.channel == 'stable' }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: packages/server/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
