name: create-experimental-release

on:
  workflow_dispatch:
    inputs:
      version:
        description: SemVer prerelease without v, for example 1.3.12-experimental.1
        required: true
        type: string
      dry_run:
        description: Validate and test without creating the tag
        required: true
        default: true
        type: boolean

permissions:
  actions: write
  contents: write

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch main and release branches
        run: git fetch --force origin '+refs/heads/main:refs/remotes/origin/main' '+refs/heads/release/*:refs/remotes/origin/release/*' --tags
      - name: Validate release policy
        run: node scripts/release-policy.mjs "v${{ inputs.version }}" "${GITHUB_SHA}"
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm run test:release-policy
      - run: npm run test:server-lifecycle
      - name: Create experimental tag
        if: ${{ !inputs.dry_run }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v${{ inputs.version }}" -m "Experimental release ${{ inputs.version }}"
          git push origin "v${{ inputs.version }}"
      - name: Dispatch tag publication workflows
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ inputs.version }}
        run: |
          gh workflow run release-npm.yml --ref "$TAG"
          gh workflow run release-hook.yml --ref "$TAG"
          gh workflow run release-server-image.yml --ref "$TAG"
