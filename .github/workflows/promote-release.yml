name: promote-stable-release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Stable SemVer without v, for example 1.3.12
        required: true
        type: string
      dry_run:
        description: Validate and test without creating the tag
        required: true
        default: true
        type: boolean

permissions:
  contents: write

jobs:
  release:
    if: startsWith(github.ref, 'refs/heads/release/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch main and release branches
        run: git fetch --force origin '+refs/heads/main:refs/remotes/origin/main' '+refs/heads/release/*:refs/remotes/origin/release/*' --tags
      - name: Validate release policy
        run: node scripts/release-policy.mjs "v${{ inputs.version }}" "${GITHUB_SHA}"
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm run test:release-policy
      - run: npm run test:server-lifecycle
      - name: Create stable tag
        if: ${{ !inputs.dry_run }}
        run: git tag -a "v${{ inputs.version }}" -m "Release ${{ inputs.version }}" && git push origin "v${{ inputs.version }}"
